name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.0.1)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller imageio-ffmpeg cryptography flask
          
      - name: Build executable
        run: |
          python -m PyInstaller pic_app.spec --clean --noconfirm
          
      - name: Create archive
        run: |
          Compress-Archive -Path dist/PictureAndVideos -DestinationPath PictureAndVideos-${{ env.VERSION }}-windows-x64.zip
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: PictureAndVideos-${{ env.VERSION }}-windows-x64.zip
          
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller imageio-ffmpeg cryptography flask
          
      - name: Install required system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
          
      - name: Build executable
        run: |
          python -m PyInstaller pic_app_unix.spec --clean --noconfirm
          
      - name: Create archive
        run: |
          tar -czf PictureAndVideos-${{ env.VERSION }}-linux-x64.tar.gz -C dist PictureAndVideos
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: PictureAndVideos-${{ env.VERSION }}-linux-x64.tar.gz
          
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller imageio-ffmpeg cryptography flask
          
      - name: Build executable
        run: |
          python -m PyInstaller pic_app_unix.spec --clean --noconfirm
          
      - name: Create archive
        run: |
          tar -czf PictureAndVideos-${{ env.VERSION }}-macos-arm64.tar.gz -C dist PictureAndVideos
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: PictureAndVideos-${{ env.VERSION }}-macos-arm64.tar.gz
          
  upload-assets:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true
          
      - name: Display downloaded files
        run: |
          ls -la artifacts/
          
      - name: Upload assets to existing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          body: |
            ## Picture & Videos v${{ env.VERSION }}
            
            ### 📥 下载链接
            
            | 平台 | 文件 |
            |------|------|
            | Windows x64 | PictureAndVideos-${{ env.VERSION }}-windows-x64.zip |
            | Linux x64 | PictureAndVideos-${{ env.VERSION }}-linux-x64.tar.gz |
            | macOS ARM64 | PictureAndVideos-${{ env.VERSION }}-macos-arm64.tar.gz |
            
            ### 💻 系统要求
            - **Windows**: Windows 7/8/10/11 (64位), 至少 2GB 内存
            - **Linux**: Ubuntu 18.04+/CentOS 7+/Debian 10+ (64位), 至少 2GB 内存
            - **macOS**: macOS 10.14+, Apple Silicon / Intel, 至少 2GB 内存
            
            ### ✨ 主要功能
            - 🖼️ 图片分享
            - 🎬 视频分享与转码
            - 💬 即时通讯（私聊/群聊）
            - 👥 好友系统
            - 🏛️ 小镇地图（可配置开关）
            - ✅ 内容审核和用户管理
            
            ### 🚀 快速开始
            1. 下载适合您系统的安装包
            2. 解压到任意目录
            3. Windows: 双击 PictureAndVideos.exe
            4. Linux/macOS: `chmod +x PictureAndVideos && ./PictureAndVideos`
            5. 访问 http://localhost:5001
            6. 默认账户: admin / admin123
