name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller imageio-ffmpeg cryptography flask
          
      - name: Build executable
        run: |
          python -m PyInstaller pic_app.spec --clean --noconfirm
          
      - name: Create archive
        run: |
          Compress-Archive -Path dist/PictureAndVideos -DestinationPath PictureAndVideos-${{ github.ref_name }}-windows-x64.zip
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: PictureAndVideos-${{ github.ref_name }}-windows-x64.zip
          
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller imageio-ffmpeg cryptography flask
          
      - name: Install required system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
          
      - name: Build executable
        run: |
          python -m PyInstaller pic_app_unix.spec --clean --noconfirm
          
      - name: Create archive
        run: |
          tar -czf PictureAndVideos-${{ github.ref_name }}-linux-x64.tar.gz -C dist PictureAndVideos
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: PictureAndVideos-${{ github.ref_name }}-linux-x64.tar.gz
          
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller imageio-ffmpeg cryptography flask
          
      - name: Build executable
        run: |
          python -m PyInstaller pic_app_unix.spec --clean --noconfirm
          
      - name: Create archive
        run: |
          tar -czf PictureAndVideos-${{ github.ref_name }}-macos-arm64.tar.gz -C dist PictureAndVideos
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: PictureAndVideos-${{ github.ref_name }}-macos-arm64.tar.gz
          
  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true
          
      - name: Display downloaded files
        run: |
          ls -la artifacts/
          
      - name: Generate release notes
        run: |
          echo "## Picture & Videos ${{ github.ref_name }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 下载链接" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "| 平台 | 下载 |" >> RELEASE_NOTES.md
          echo "|------|------|" >> RELEASE_NOTES.md
          echo "| Windows x64 | [下载](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PictureAndVideos-${{ github.ref_name }}-windows-x64.zip) |" >> RELEASE_NOTES.md
          echo "| Linux x64 | [下载](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PictureAndVideos-${{ github.ref_name }}-linux-x64.tar.gz) |" >> RELEASE_NOTES.md
          echo "| macOS Apple Silicon | [下载](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PictureAndVideos-${{ github.ref_name }}-macos-arm64.tar.gz) |" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 系统要求" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "- **Windows**: Windows 7/8/10/11 (64位), 至少 2GB 内存" >> RELEASE_NOTES.md
          echo "- **Linux**: Ubuntu 18.04+/CentOS 7+/Debian 10+ (64位), 至少 2GB 内存" >> RELEASE_NOTES.md
          echo "- **macOS**: macOS 10.14+, Apple Silicon / Intel, 至少 2GB 内存" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 主要功能" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "- 🖼️ 图片分享" >> RELEASE_NOTES.md
          echo "- 🎬 视频分享与转码" >> RELEASE_NOTES.md
          echo "- 💬 即时通讯（私聊/群聊）" >> RELEASE_NOTES.md
          echo "- 👥 好友系统" >> RELEASE_NOTES.md
          echo "- 🏛️ 小镇地图（可配置开关）" >> RELEASE_NOTES.md
          echo "- ✅ 内容审核和用户管理" >> RELEASE_NOTES.md
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
